name: Docs CI

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/**'
      - '*.md'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/**'
      - '*.md'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install gitleaks
        run: |
          GITLEAKS_VER=8.24.3
          curl -sL "https://github.com/zricethezav/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks && tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Run secret scan (gitleaks) - filesystem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          /tmp/gitleaks/gitleaks detect --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug --source .
          zip -j gitleaks-results.sarif.zip results.sarif || true

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install markdownlint
        run: |
          npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          echo "Running markdownlint..."
          markdownlint '**/*.md' || exit 1

      - name: Run link checker (linkinator)
        run: |
          npx -y linkinator docs || true

